name: ROCK 4SE Noctua PWM Fan
version: "0.2.1"
slug: rock4se_noctua_pwm_fan
description: Temperature-controlled Noctua NF-A4x20 5V PWM fan for Radxa ROCK 4SE
url: https://github.com/josefseger/rock4se-pwm-fan-noctua
arch:
  - aarch64
startup: services
boot: auto
init: false
apparmor: false
protected: true
devices:
  - /dev/mem
  - /dev/gpiochip2
privileged:
  - SYS_RAWIO
options:
  poll_seconds: 5
  min_speed: 25
  tach_window_seconds: 2
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  poll_seconds: int(2,60)
  min_speed: int(0,100)
  tach_window_seconds: int(1,10)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
